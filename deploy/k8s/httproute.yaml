apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tailground
  namespace: tailground
  labels:
    app.kubernetes.io/name: tailground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: tailground-web   # the listener added by gateway-listener-patch.yaml
  hostnames:
    - ${TAILGROUND_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: tailground
          port: 8080
