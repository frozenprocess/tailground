# Included in the server block and again in every location that sets its own
# add_header (nginx drops inherited headers in a location that adds any).
#
# script-src's sha256 is the pre-paint theme script inlined in web/index.html;
# if that script changes, recompute it (sha256 of the text between the tags)
# or the page just loses its no-flash theme resolution. 'wasm-unsafe-eval' is
# for the Go/WASM engine; styles stay 'unsafe-inline' (React Flow / CodeMirror
# set inline styles).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-tgob66Vm6vHSTJXHni4C1ONU/Ds75str/fNX0UD5QF4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
