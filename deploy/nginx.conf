# Tailground static-site server. Included from the stock nginx.conf `http`
# block, which already `include`s /etc/nginx/mime.types (that map carries
# `application/wasm wasm;`, required for WebAssembly.instantiateStreaming).

# Versioned engine URLs (?v=<hash>) are immutable; bare ones revalidate.
map $arg_v $engine_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# Real client address for the API's rate limits. Behind Cloudflare and the
# cluster gateway the TCP peer is the gateway; the gateway appends the address
# it saw (the Cloudflare edge) as the rightmost X-Forwarded-For entry. Only when
# that address is a Cloudflare range do we believe CF-Connecting-IP; otherwise
# the rightmost entry itself is the client (a direct request), and any
# CF-Connecting-IP / leading XFF the client sent is discarded. Refresh the
# ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 now and then.
map $http_x_forwarded_for $xff_last {
    default                "";
    "~(?<last>[^,\s]+)\s*$" $last;
}
geo $xff_last $from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $from_cloudflare $client_ip {
    1       $http_cf_connecting_ip;
    default $xff_last;
}
map $client_ip $api_client_ip {
    ""      $remote_addr;
    default $client_ip;
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # gzip; the big payload (engine.wasm) compresses ~4x.
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml application/manifest+json;

    # Hash routing (#/…) means every real path is index.html. It names the
    # current hashed bundles, so it must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Short share links: the tailground-api sidecar container (same pod). The
    # API rate-limits on CF-Connecting-IP, which we overwrite with the verified
    # client address ($api_client_ip, above) so a client can't pick its own.
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header CF-Connecting-IP $api_client_ip;
        proxy_set_header X-Forwarded-For $api_client_ip;
        include /etc/nginx/security-headers.conf;
        proxy_read_timeout 15s;
        # Cache-Control comes from the API (immutable share bodies, no-store
        # for everything else); don't append a second, contradictory one.
    }

    # Content-hashed bundles — safe to cache forever.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header  Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Engine files: the page requests them as ?v=<engine content hash>, so a
    # versioned URL never changes content and can be cached forever. A bare
    # URL (a page from before versioning) always revalidates.
    location = /engine.wasm {
        default_type application/wasm;
        add_header    Cache-Control $engine_cache;
        include       /etc/nginx/security-headers.conf;
    }
    location = /wasm_exec.js { add_header Cache-Control $engine_cache; include /etc/nginx/security-headers.conf; }
    location = /worker.js    { add_header Cache-Control $engine_cache; include /etc/nginx/security-headers.conf; }

    location = /healthz {
        access_log off;
        add_header  Content-Type text/plain;
        return 200 "ok\n";
    }
}
