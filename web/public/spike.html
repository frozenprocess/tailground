<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailground - Stay a while and play</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 60rem; }
  h1 { font-size: 1.1rem; }
  textarea { width: 100%; box-sizing: border-box; min-height: 12rem; font: inherit; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1 1 22rem; }
  table { border-collapse: collapse; margin: .5rem 0; }
  th, td { border: 1px solid #8886; padding: .15rem .5rem; text-align: center; }
  td.allow { background: #2ecc7133; }
  td.deny  { background: #e74c3c22; color: #8888; }
  .diag { white-space: pre-wrap; padding: .25rem .5rem; border-left: 3px solid; margin: .25rem 0; }
  .diag.error { border-color: #e74c3c; }
  .diag.warning { border-color: #f39c12; }
  .diag.info { border-color: #3498db; }
  #timing { color: #888; }
  button { font: inherit; padding: .3rem .8rem; }
</style>
</head>
<body>
<h1>Tailground - Stay a while and play<span id="timing"></span></h1>
<p>Engine runs in a Web Worker as WASM. Edit either box; it re-evaluates on change.</p>

<div class="row">
  <div>
    <label><strong>policy.hujson</strong></label>
    <textarea id="policy"></textarea>
  </div>
  <div>
    <label><strong>snapshot.json</strong></label>
    <textarea id="snapshot"></textarea>
  </div>
</div>
<button id="run">evaluate</button>

<div id="engine"></div>
<div id="diags"></div>
<div id="matrices"></div>
<div id="ssh"></div>
<div id="grants"></div>
<div id="nodecaps"></div>
<details><summary>compiled packet filter (per device)</summary><pre id="rules"></pre></details>
<details><summary>raw result JSON</summary><pre id="raw"></pre></details>

<script>
const DEMO_POLICY = `{
  // Try editing — everything re-evaluates. HuJSON comments & trailing commas are fine.
  "tagOwners": {
    "tag:web": ["alice@example.com"],
    "tag:db":  ["alice@example.com"],
  },
  "acls": [
    { "action": "accept", "src": ["alice@example.com"], "dst": ["tag:web:443"] },
    { "action": "accept", "src": ["tag:web"],           "dst": ["tag:db:5432"] },
  ],
  "grants": [
    { "src": ["alice@example.com"], "dst": ["tag:web"], "app": { "example.com/cap/admin": [{ "role": "admin" }] } },
  ],
  "nodeAttrs": [
    { "target": ["tag:web"], "attr": ["mullvad"] },
  ],
}`;

const DEMO_SNAPSHOT = JSON.stringify({
  users: [{ id: 1, email: "alice@example.com" }],
  devices: [
    { id: 1, name: "alice-laptop", user: "alice@example.com", ipv4: "100.64.0.1", ipv6: "fd7a:115c:a1e0::1", os: "macos" },
    { id: 2, name: "web-1", tags: ["tag:web"], ipv4: "100.64.0.2", ipv6: "fd7a:115c:a1e0::2", os: "linux" },
    { id: 3, name: "db-1",  tags: ["tag:db"],  ipv4: "100.64.0.3", ipv6: "fd7a:115c:a1e0::3", os: "linux" }
  ]
}, null, 2);

const DEMO_PROBES = [
  { name: "https", proto: "tcp", port: 443 },
  { name: "pg",    proto: "tcp", port: 5432 },
  { name: "ssh",   proto: "tcp", port: 22 }
];

const $ = (id) => document.getElementById(id);
$("policy").value = DEMO_POLICY;
$("snapshot").value = DEMO_SNAPSHOT;

// Cache-bust per page load: worker.js forwards this ?v= to wasm_exec.js and
// engine.wasm, so a rebuilt engine can never pair with a cached old worker.
const worker = new Worker("worker.js?v=" + Date.now());
let ready = false;
let reqId = 0;

worker.onmessage = (e) => {
  if (e.data.type === "ready") { ready = true; run(); return; }
  if (e.data.type === "error") { $("diags").innerHTML = `<div class="diag error">${e.data.message}</div>`; return; }
  const { result, ms } = e.data;
  render(result, ms);
};

function run() {
  if (!ready) return;
  let snapshot;
  try { snapshot = JSON.parse($("snapshot").value); }
  catch (err) { $("diags").innerHTML = `<div class="diag error">snapshot.json: ${err.message}</div>`; return; }
  const req = { policy: $("policy").value, snapshot, probes: DEMO_PROBES };
  worker.postMessage({ id: ++reqId, request: req });
}

let deb;
const schedule = () => { clearTimeout(deb); deb = setTimeout(run, 200); };
$("policy").addEventListener("input", schedule);
$("snapshot").addEventListener("input", schedule);
$("run").addEventListener("click", run);

function render(res, ms) {
  $("timing").textContent = typeof ms === "number" ? `(${ms.toFixed(1)} ms)` : "";
  $("raw").textContent = JSON.stringify(res, null, 2);

  $("engine").innerHTML = res.engine
    ? `<p style="color:#888">engine: headscale ${res.engine.headscaleCommit.slice(0,10)} · tailscale ${res.engine.tailscaleVersion}</p>`
    : "";

  $("diags").innerHTML = (res.diagnostics || [])
    .map((d) => `<div class="diag ${d.severity}">[${d.code}] ${d.pointer ? d.pointer + " — " : ""}${d.message}</div>`)
    .join("");

  const actors = res.actors || [];
  const byId = Object.fromEntries(actors.map((a) => [a.id, a]));
  const label = (a) => `${a.name}${a.tags && a.tags.length ? " " + a.tags.join(",") : a.user ? " (" + a.user + ")" : ""}`;

  let html = "";
  for (const [probe, cells] of Object.entries(res.matrices || {})) {
    html += `<h3>${probe}</h3><table><tr><th>src \\ dst</th>`;
    for (const a of actors) html += `<th>${label(a)}</th>`;
    html += `</tr>`;
    for (const s of actors) {
      html += `<tr><th>${label(s)}</th>`;
      for (const d of actors) {
        if (s.id === d.id) { html += `<td>·</td>`; continue; }
        const v = cells[`${s.id}->${d.id}`] || "?";
        html += `<td class="${v}">${v}</td>`;
      }
      html += `</tr>`;
    }
    html += `</table>`;
  }
  $("matrices").innerHTML = html;

  const name = (id) => (byId[id] ? byId[id].name : id);

  const ssh = res.ssh || {};
  if (Object.keys(ssh).length) {
    // group by "user@" then render a src×dst table per user
    const byUser = {};
    for (const [k, v] of Object.entries(ssh)) {
      const [u, pair] = k.split("@");
      (byUser[u] ||= {})[pair] = v;
    }
    let sh = "<h3>SSH</h3>";
    for (const [u, cells] of Object.entries(byUser)) {
      sh += `<h4 style="margin:.3rem 0">as <code>${u}</code></h4><table><tr><th>src \\ dst</th>`;
      for (const a of actors) sh += `<th>${label(a)}</th>`;
      sh += `</tr>`;
      for (const s of actors) {
        sh += `<tr><th>${label(s)}</th>`;
        for (const d of actors) {
          if (s.id === d.id) { sh += `<td>·</td>`; continue; }
          const v = cells[`${s.id}->${d.id}`];
          const cls = v === "accept" ? "allow" : v === "deny" || !v ? "deny" : "";
          sh += `<td class="${cls}">${v || "n/a"}</td>`;
        }
        sh += `</tr>`;
      }
      sh += `</table>`;
    }
    $("ssh").innerHTML = sh;
  } else {
    $("ssh").innerHTML = "";
  }

  const grants = res.grants || {};
  $("grants").innerHTML = Object.keys(grants).length
    ? "<h3>app grants</h3>" + Object.entries(grants)
        .map(([k, caps]) => { const [s, d] = k.split("->"); return `<div>${name(s)} → ${name(d)}: <code>${caps.join(", ")}</code></div>`; })
        .join("")
    : "";

  const caps = res.nodeCaps || {};
  $("nodecaps").innerHTML = Object.keys(caps).length
    ? "<h3>node capabilities (nodeAttrs)</h3>" + Object.entries(caps)
        .map(([id, m]) => `<div>${name(Number(id))}: <code>${Object.keys(m).join(", ")}</code></div>`)
        .join("")
    : "";

  const rules = res.rules || {};
  $("rules").textContent = Object.entries(rules)
    .map(([id, rs]) => `${name(Number(id))}:\n` + rs.map((r) =>
      `  src ${(r.srcIPs || []).join(",")}` +
      (r.dstPorts ? `  →  ${r.dstPorts.join(", ")}` : "") +
      (r.ipProto ? `  proto ${r.ipProto.join(",")}` : "") +
      (r.capGrant ? `  cap ${r.capGrant.join("; ")}` : "")
    ).join("\n")).join("\n\n");
}
</script>
</body>
</html>
