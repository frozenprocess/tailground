name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Headscale module can't be fetched through the Go proxy (a golden-test file
# has a '>' in its path), so it's pulled in via `replace => ../headscale`.
env:
  HEADSCALE_REF: 63123196cc21eeb301eec60bf05d5fe0a2bc4787

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tailground
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juanfont/headscale
          ref: ${{ env.HEADSCALE_REF }}
          path: headscale
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache-dependency-path: tailground/go.sum
      # Applies the Headscale capability patch inside vendor/; go vet/test pick
      # vendor/ up automatically, and some tests need the patched capabilities.
      - name: vendor
        working-directory: tailground
        run: make vendor
      - name: gofmt
        working-directory: tailground
        run: test -z "$(gofmt -l engine/)" || (gofmt -l engine/ && exit 1)
      - name: go vet
        working-directory: tailground
        run: go vet ./...
      - name: go test
        working-directory: tailground
        run: go test ./...
      - name: offline harness
        working-directory: tailground
        run: make e2e-offline
      - name: build WASM
        working-directory: tailground
        run: make wasm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tailground
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juanfont/headscale
          ref: ${{ env.HEADSCALE_REF }}
          path: headscale
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache-dependency-path: tailground/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tailground/web/package-lock.json
      - name: build engine
        working-directory: tailground
        run: make vendor && make wasm
      - name: install
        working-directory: tailground/web
        run: npm ci
      - name: unit tests
        working-directory: tailground/web
        run: npm test
      - name: typecheck + build
        working-directory: tailground/web
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
